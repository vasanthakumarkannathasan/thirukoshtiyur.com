<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .namam-white { fill: #FFFFFF; }
      .namam-red { fill: #DC143C; }
      .namam-bg { fill: #9B2226; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="4" class="namam-bg"/>
  
  <!-- Simplified Namam symbol for favicon -->
  <!-- Left white line -->
  <path d="M 10 8 Q 10 18, 11 22 L 12 22 Q 11 18, 11 8 Z" class="namam-white"/>
  
  <!-- Right white line -->
  <path d="M 22 8 Q 22 18, 21 22 L 20 22 Q 21 18, 21 8 Z" class="namam-white"/>
  
  <!-- Center red line (Sri Churnam) -->
  <rect x="15" y="7" width="2" height="18" class="namam-red"/>
  
  <!-- Bottom dot -->
  <circle cx="16" cy="26" r="1.5" fill="#FFD700"/>
</svg>
