<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <defs>
    <style>
      .symbol-fill { fill: #9B2226; }
      .symbol-accent { fill: #BB9457; }
      .symbol-highlight { fill: #FFD700; }
      .symbol-outline { stroke: #3E2723; stroke-width: 1.5; fill: none; }
    </style>
    
    <!-- Gradient for 3D effect -->
    <radialGradient id="goldGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BB9457;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Sangu (Conch Shell) - Left Side -->
  <g id="conch" transform="translate(50, 50)">
    <!-- Main shell body -->
    <ellipse cx="0" cy="0" rx="22" ry="28" fill="url(#goldGradient)" stroke="#3E2723" stroke-width="1.5"/>
    
    <!-- Spiral opening -->
    <path d="M -8 -10 Q -5 -15, 0 -15 Q 5 -15, 8 -10 Q 10 -5, 10 0 Q 10 8, 5 12 Q 0 15, -5 12 Q -10 8, -10 0 Q -10 -5, -8 -10" 
          class="symbol-fill" stroke="#3E2723" stroke-width="1"/>
    
    <!-- Spiral ridges -->
    <path d="M -5 -8 Q 0 -10, 5 -8" class="symbol-outline"/>
    <path d="M -6 -3 Q 0 -5, 6 -3" class="symbol-outline"/>
    <path d="M -7 2 Q 0 0, 7 2" class="symbol-outline"/>
    <path d="M -6 7 Q 0 5, 6 7" class="symbol-outline"/>
    
    <!-- Opening highlight -->
    <ellipse cx="0" cy="0" rx="4" ry="6" class="symbol-highlight" opacity="0.6"/>
    
    <!-- Decorative ridges on shell -->
    <path d="M -15 -8 L -18 -12" class="symbol-outline"/>
    <path d="M -15 0 L -20 0" class="symbol-outline"/>
    <path d="M -15 8 L -18 12" class="symbol-outline"/>
  </g>
  
  <!-- Chakra (Discus) - Right Side -->
  <g id="chakra" transform="translate(150, 50)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="28" fill="url(#goldGradient)" stroke="#3E2723" stroke-width="2"/>
    
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#3E2723" stroke-width="1.5"/>
    
    <!-- Center hub -->
    <circle cx="0" cy="0" r="8" class="symbol-fill" stroke="#3E2723" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" class="symbol-highlight"/>
    
    <!-- Spokes (8 spokes for Sudarshana Chakra) -->
    <g class="symbol-outline">
      <line x1="0" y1="-22" x2="0" y2="-8" stroke-width="2"/>
      <line x1="0" y1="22" x2="0" y2="8" stroke-width="2"/>
      <line x1="-22" y1="0" x2="-8" y2="0" stroke-width="2"/>
      <line x1="22" y1="0" x2="8" y2="0" stroke-width="2"/>
      <line x1="-15.5" y1="-15.5" x2="-5.7" y2="-5.7" stroke-width="2"/>
      <line x1="15.5" y1="15.5" x2="5.7" y2="5.7" stroke-width="2"/>
      <line x1="15.5" y1="-15.5" x2="5.7" y2="-5.7" stroke-width="2"/>
      <line x1="-15.5" y1="15.5" x2="-5.7" y2="5.7" stroke-width="2"/>
    </g>
    
    <!-- Sharp edge points around outer rim (teeth of chakra) -->
    <g class="symbol-fill">
      <polygon points="0,-28 -2,-30 2,-30" transform="rotate(0 0 0)"/>
      <polygon points="0,-28 -2,-30 2,-30" transform="rotate(45 0 0)"/>
      <polygon points="0,-28 -2,-30 2,-30" transform="rotate(90 0 0)"/>
      <polygon points="0,-28 -2,-30 2,-30" transform="rotate(135 0 0)"/>
      <polygon points="0,-28 -2,-30 2,-30" transform="rotate(180 0 0)"/>
      <polygon points="0,-28 -2,-30 2,-30" transform="rotate(225 0 0)"/>
      <polygon points="0,-28 -2,-30 2,-30" transform="rotate(270 0 0)"/>
      <polygon points="0,-28 -2,-30 2,-30" transform="rotate(315 0 0)"/>
    </g>
    
    <!-- Decorative center dot -->
    <circle cx="0" cy="0" r="2" fill="#3E2723"/>
  </g>
  
  <!-- Dividing line between symbols -->
  <line x1="100" y1="15" x2="100" y2="85" stroke="#BB9457" stroke-width="1" opacity="0.3"/>
</svg>
