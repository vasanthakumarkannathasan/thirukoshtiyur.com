<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .namam-white { fill: #FFFFFF; }
      .namam-red { fill: #DC143C; }
      .namam-yellow { fill: #FFD700; }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#FFF8E1" stroke="#9B2226" stroke-width="2"/>
  
  <!-- Namam (Urdhva Pundra) - White U-shape -->
  <path d="M 30 35 Q 30 65, 35 70 L 38 70 Q 33 65, 33 35 Z" class="namam-white" stroke="#333" stroke-width="0.5"/>
  <path d="M 70 35 Q 70 65, 65 70 L 62 70 Q 67 65, 67 35 Z" class="namam-white" stroke="#333" stroke-width="0.5"/>
  
  <!-- Center red line (Sri Churnam) -->
  <rect x="48" y="30" width="4" height="45" class="namam-red" rx="1"/>
  
  <!-- Yellow/Gold base -->
  <ellipse cx="50" cy="77" rx="8" ry="3" class="namam-yellow"/>
  
  <!-- Decorative border -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#BB9457" stroke-width="1" opacity="0.5"/>
</svg>
